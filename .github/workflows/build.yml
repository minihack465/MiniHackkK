name: Build MiniHack

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest

      - uses: actions/upload-artifact@v4
        with:
          name: MiniHack-build
          path: build/**/*.geode
          if-no-files-found: error
